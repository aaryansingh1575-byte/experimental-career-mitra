<script>
/* ================= PANEL 3 — STRICT COMMON GROUND ================= */

function familyIntersectionBlock(st,an,fams){

  const acceptedConcerns = fams.flatMap(([id,f]) =>
    arr(f.qa)
      .filter(x => x.accepted && String(x.a || '').trim())
      .map(x => ({
        q: String(x.q || ''),
        a: String(x.a || '')
      }))
  );

  if(!acceptedConcerns.length) return '';

  /*
   * IMPORTANT:
   * Generic support is NOT career evidence.
   *
   * Example:
   * "I support whatever he wants"       -> 0 career-selection points
   * "Salary is no problem"              -> no salary preference
   * "I don't care what relatives think" -> no social constraint
   *
   * Explicit statements such as:
   * "I want him to become a pilot"
   * "I prefer surgeon"
   * are strong career-specific evidence.
   */

  const studentRoles = an.roles || [];
  const studentRank = {};

  studentRoles.forEach((r,i)=>{
    studentRank[r.n] =
      Math.max(0,1-i/Math.max(1,studentRoles.length));
  });

  const vault = st.vault || {};

  const studentText = [
    roleNames(vault).join(' '),
    vault.nonnegotiable || '',
    vault.field || '',
    arr(vault.interests).join(' '),
    arr(vault.hobbies).join(' '),
    arr(vault.likings).join(' '),
    subjNames(vault).join(' '),
    skillNames(vault).join(' ')
  ].join(' ').toLowerCase();

  const careerAliases = {

    'Doctor / Healthcare Professional':[
      'doctor','doctors','medical','medicine','mbbs',
      'surgeon','surgery','healthcare','health care',
      'physician','hospital','life saving','life-saving'
    ],

    'Software Engineer':[
      'software','developer','coding','programming',
      'computer science','web developer','app developer'
    ],

    'Data Scientist / ML Engineer':[
      'data scientist','machine learning','ml engineer',
      'artificial intelligence','ai engineer','data science'
    ],

    'Cybersecurity Analyst':[
      'cybersecurity','cyber security','ethical hacking',
      'security analyst','hacking'
    ],

    'Defence / Space Scientist (DRDO, ISRO)':[
      'drdo','isro','defence scientist','space scientist',
      'aerospace','defence','defense'
    ],

    'Embedded / Robotics Engineer':[
      'embedded','robotics','robot','iot',
      'electronics','firmware','drone'
    ],

    'Teacher / Professor':[
      'teacher','professor','teaching','lecturer','education'
    ],

    'Counsellor / Psychologist':[
      'psychologist','psychology','counsellor',
      'counselor','therapy','therapist'
    ],

    'Civil Services (IAS / IPS)':[
      'ias','ips','upsc','civil services',
      'government officer','administration'
    ],

    'Chartered Accountant / Finance Analyst':[
      'chartered accountant','ca','finance analyst',
      'accounting','investment','banking'
    ],

    'Journalist / Content Creator':[
      'journalist','journalism','content creator',
      'writer','media','youtube'
    ],

    'Mechanical / Civil Engineer':[
      'mechanical engineer','civil engineer',
      'mechanical','civil engineering'
    ],

    'Lawyer':[
      'lawyer','advocate','law','llb','legal'
    ],

    'Marketing / Business Manager':[
      'marketing','business manager','sales',
      'mba','brand'
    ],

    'Research Scientist':[
      'research scientist','scientist','research',
      'phd','laboratory','lab'
    ]
  };


  function careerMatchesText(c,t){

    t = String(t || '').toLowerCase();

    const words = [
      c.n,
      ...arr(c.kw),
      ...(careerAliases[c.n] || [])
    ].map(x => String(x).toLowerCase());

    return words.some(k =>
      k.length >= 4 && t.includes(k)
    );
  }


  function careerText(c){

    return `${c.n}
      ${c.mkt}
      ${arr(c.pros).join(' ')}
      ${arr(c.cons).join(' ')}
      ${arr(c.alt).join(' ')}
    `.toLowerCase();
  }


  /*
   * Convert family answer into meaning.
   */

  function interpretFamilyAnswer(signal){

    const q = signal.q.toLowerCase();
    const a = signal.a.toLowerCase();
    const t = q + ' ' + a;

    let kind = 'neutral';
    let strength = 0;
    let dimensions = [];
    let explicitCareers = [];

    const noConstraint =
      /no problem|
       no issue|
       doesn.?t matter|
       don.?t care|
       dont care|
       whatever he wants|
       whatever she wants|
       support whatever|
       no limit|
       no loans|
       i am here for him|
       full support|
       already with him|
       i support him|
       i support her|
       salary is no problem|
       money is no problem|
       financially support|
       can support/i.test(a);

    const explicit =
      /i want him|
       i want her|
       want him to|
       want her to|
       prefer|
       my choice|
       my preference|
       should become|
       i would prefer|
       i would like/i.test(a);

    const concern =
      /worr|
       concern|
       afraid|
       risk|
       problem|
       scared|
       fear|
       tension|
       not sure|
       uncertain|
       doubt|
       difficult|
       hard|
       losing|
       failure|
       security|
       stable|
       stability/i.test(a);


    CAREERS.forEach(c=>{

      if(careerMatchesText(c,a)){
        explicitCareers.push(c.n);
      }

    });


    const uniqueCareers = [
      ...new Set(explicitCareers)
    ];


    /*
     * EXPLICIT CAREER PREFERENCE
     */

    if(
      uniqueCareers.length &&
      explicit
    ){

      kind = 'explicit_preference';
      strength = 1;

    }

    /*
     * Career mentioned but not explicitly preferred.
     * Example:
     * "surgeon as its life saving job"
     */

    else if(
      uniqueCareers.length &&
      /surgeon|
       pilot|
       doctor|
       engineer|
       career|
       role|
       job/i.test(q + ' ' + a)
    ){

      kind = 'career_specific_support';
      strength = 0.8;

    }

    /*
     * No constraint.
     */

    else if(noConstraint){

      kind = 'no_constraint';
      strength = 0;

    }

    /*
     * Actual concern.
     */

    else if(concern){

      kind = 'concern';
      strength = 1;

    }

    /*
     * Generic emotional/supportive answer.
     * ZERO career points.
     */

    else if(
      /support|
       trust|
       happy|
       happiness|
       life|
       dream|
       interest|
       passion|
       choice/i.test(a)
    ){

      kind = 'general_support';
      strength = 0;

    }


    /*
     * Concern dimensions.
     */

    if(
      /salary|
       income|
       earning|
       money|
       financial|
       spend|
       fee|
       fees|
       loan|
       debt|
       cost|
       budget/i.test(t)
    ){
      dimensions.push('finance');
    }

    if(
      /security|
       stable|
       stability|
       job security|
       permanent|
       government job/i.test(t)
    ){
      dimensions.push('stability');
    }

    if(
      /future|
       scope|
       demand|
       growth|
       10 years|
       long term/i.test(t)
    ){
      dimensions.push('future');
    }

    if(
      /respect|
       relative|
       society|
       community|
       neighbour|
       status/i.test(t)
    ){
      dimensions.push('social');
    }

    if(
      /away from home|
       move|
       relocat|
       posting|
       transfer|
       city|
       home/i.test(t)
    ){
      dimensions.push('location');
    }

    if(
      /education|
       degree|
       college|
       study|
       training|
       course|
       how long/i.test(t)
    ){
      dimensions.push('education');
    }

    if(
      /work life|
       work-life|
       hours|
       stress|
       pressure|
       family time|
       on call/i.test(t)
    ){
      dimensions.push('worklife');
    }

    if(
      /competition|
       exam|
       selection|
       success rate/i.test(t)
    ){
      dimensions.push('competition');
    }

    if(
      /risk|
       uncertain|
       failure|
       backup|
       alternative/i.test(t)
    ){
      dimensions.push('risk');
    }

    if(
      /interest|
       passion|
       choice|
       dream|
       liking|
       like|
       want/i.test(t)
    ){
      dimensions.push('interest');
    }

    if(
      /skills|
       result|
       prove|
       experience|
       mentor/i.test(t)
    ){
      dimensions.push('proof');
    }


    return {
      q: signal.q,
      a: signal.a,
      kind,
      strength,
      dimensions: [...new Set(dimensions)],
      careers: uniqueCareers
    };
  }


  const familySignals =
    acceptedConcerns.map(interpretFamilyAnswer);


  const explicitPreferences =
    familySignals.filter(x =>
      x.kind === 'explicit_preference' ||
      x.kind === 'career_specific_support'
    );


  const constraints =
    familySignals.filter(x =>
      x.kind === 'concern'
    );


  const neutralAnswers =
    familySignals.filter(x =>
      x.kind === 'no_constraint' ||
      x.kind === 'general_support'
    );


  /*
   * Compare an actual family concern with a career.
   */

  function constraintEffect(signal,c){

    if(signal.kind !== 'concern'){
      return null;
    }

    const q =
      `${signal.q} ${signal.a}`.toLowerCase();

    const hay =
      careerText(c);

    let label = '';
    let effect = 0;


    if(
      /job security|
       stable|
       stability|
       secure/i.test(q)
    ){

      label = 'job stability';

      effect =
        /stable|
         security|
         secure|
         government|
         public|
         steady/i.test(hay)
          ? 1
          : -1;

    }


    else if(
      /salary|
       income|
       earning|
       financial|
       money/i.test(q)
    ){

      label = 'income / earning';

      effect =
        /salary|
         pay|
         earning|
         income|
         lpa|
         high demand/i.test(hay)
          ? 1
          : -1;

    }


    else if(
      /future|
       scope|
       demand|
       growth|
       10 years|
       long term/i.test(q)
    ){

      label = 'future scope';

      effect =
        /demand|
         growing|
         growth|
         future|
         stable|
         strong/i.test(hay)
          ? 1
          : -1;

    }


    else if(
      /relocat|
       away from home|
       posting|
       transfer|
       city|
       home/i.test(q)
    ){

      label = 'location / relocation';

      /*
       * No automatic positive claim.
       * Career data must explicitly indicate mobility.
       */

      effect =
        /posting|
         transferable|
         multiple locations|
         relocation|
         nationwide/i.test(hay)
          ? 1
          : 0;

    }


    else if(
      /education|
       degree|
       college|
       study|
       training|
       course|
       how long/i.test(q)
    ){

      label = 'education / training';

      effect =
        /degree|
         mbbs|
         b\.tech|
         btech|
         m\.tech|
         ms|
         certification|
         diploma|
         training/i.test(hay)
          ? 1
          : 0;

    }


    else if(
      /competition|
       exam|
       selection|
       success rate/i.test(q)
    ){

      label = 'competition / selection';

      effect =
        /selective|
         competitive|
         entrance|
         exam|
         difficult/i.test(hay)
          ? -1
          : 0;

    }


    else if(
      /work life|
       work-life|
       hours|
       stress|
       pressure|
       family time|
       on call/i.test(q)
    ){

      label = 'work-life / workload';

      effect =
        /long hours|
         stress|
         pressure|
         on-call|
         emergency/i.test(hay)
          ? -1
          : 0;

    }


    else if(
      /risk|
       uncertain|
       failure|
       backup|
       alternative/i.test(q)
    ){

      label = 'career risk';

      effect =
        /stable|
         government|
         established|
         strong demand|
         multiple pathways/i.test(hay)
          ? 1
          : 0;

    }


    return {
      label,
      effect
    };
  }


  /*
   * Student-side analysis.
   */

  function studentEvidence(c){

    let fit = 0;
    let evidence = [];


    const rank =
      studentRank[c.n] || 0;

    if(rank > 0){

      fit += rank * 4;

      const role =
        studentRoles.find(r=>r.n===c.n);

      evidence.push(
        `Test Zone career ranking: ${
          role ? role.rank : 'analysed'
        }`
      );
    }


    const directVault =
      careerMatchesText(c,studentText);

    if(directVault){

      fit += 2.5;

      evidence.push(
        'Personal Vault shows related interests, roles, subjects or skills.'
      );
    }


    if(
      String(vault.nonnegotiable || '')
        .toLowerCase()
        .includes(c.n.toLowerCase())
    ){

      fit += 5;

      evidence.push(
        'This is the student’s non-negotiable career.'
      );
    }


    if(
      arr(vault.alternatives)
        .some(x =>
          String(x).toLowerCase()
            .includes(c.n.toLowerCase())
        )
    ){

      fit += 1.5;

      evidence.push(
        'Student listed this as an alternative career.'
      );
    }


    if(
      an.type &&
      /realistic|investigative/i.test(an.type) &&
      /engineer|scientist|doctor|healthcare|research/i.test(c.n)
    ){

      fit += 1;

      evidence.push(
        `Personality pattern ${an.type} has relevant alignment.`
      );
    }


    return {
      fit,
      evidence
    };
  }


  /*
   * Family-side analysis.
   */

  function familyEvidence(c){

    let score = 0;

    const matched = [];
    const conflicts = [];
    const context = [];


    /*
     * Explicit preferences are the strongest family evidence.
     */

    explicitPreferences.forEach(signal=>{

      const direct =
        signal.careers.includes(c.n);

      if(direct){

        score +=
          signal.kind === 'explicit_preference'
            ? 6
            : 4;

        matched.push({
          label:
            signal.kind === 'explicit_preference'
              ? 'Explicit family preference'
              : 'Career-specific family support',

          a: signal.a
        });

      }

    });


    /*
     * Real family concerns.
     */

    constraints.forEach(signal=>{

      const result =
        constraintEffect(signal,c);

      if(
        result &&
        result.label
      ){

        if(result.effect > 0){

          score += 2;

          matched.push({
            label:
              `Supports family concern: ${result.label}`,
            a: signal.a
          });

        }

        else if(result.effect < 0){

          score -= 3;

          conflicts.push({
            label:
              `Conflicts with family concern: ${result.label}`,
            a: signal.a
          });

        }

      }

    });


    /*
     * Neutral/general support is NEVER counted as
     * career-specific evidence.
     */

    neutralAnswers.forEach(signal=>{

      context.push({
        label:
          signal.kind === 'no_constraint'
            ? 'No constraint'
            : 'General family support',

        a: signal.a
      });

    });


    return {
      score,
      matched,
      conflicts,
      context
    };
  }


  /*
   * Analyse every candidate career.
   */

  const results =
    CAREERS.map(c=>{

      const ss =
        studentEvidence(c);

      const fs =
        familyEvidence(c);


      /*
       * Family evidence gate.
       *
       * A generic "I support him" answer does not pass.
       */

      const genuineFamilyEvidence =
        fs.matched.length > 0;


      /*
       * Student evidence gate.
       */

      const genuineStudentEvidence =
        ss.fit >= 1;


      /*
       * Candidate is only eligible when BOTH sides
       * have actual evidence.
       */

      const eligible =
        genuineStudentEvidence &&
        genuineFamilyEvidence &&
        fs.score > 0;


      return {
        c,
        ss,
        fs,
        eligible
      };

    });


  /*
   * Rank only genuine overlaps.
   */

  let eligible =
    results
      .filter(x=>x.eligible)
      .sort((a,b)=>{

        const aScore =
          a.ss.fit * 0.58 +
          a.fs.score * 0.42;

        const bScore =
          b.ss.fit * 0.58 +
          b.fs.score * 0.42;

        return bScore-aScore;

      });


  /*
   * Do not force three careers.
   */

  const picks =
    eligible.slice(0,3);


  const maxStudent =
    Math.max(
      1,
      ...picks.map(x=>x.ss.fit)
    );


  const maxFamily =
    Math.max(
      1,
      ...picks.map(x=>Math.max(0,x.fs.score))
    );


  const neutralCount =
    neutralAnswers.length;


  /*
   * Explicit preference summary.
   */

  const preferenceHTML =
    explicitPreferences.length
      ? `<div class="note ok small" style="margin-top:10px">
          <b>Explicit family preferences detected:</b>
          ${explicitPreferences.map(x=>`
            <div style="margin-top:5px">
              • ${esc(x.a)}
            </div>
          `).join('')}
        </div>`
      : '';


  return `
  <div class="card">

    <div class="row sp">

      <div>

        <div class="muted small">
          Family + Student evidence intersection
        </div>

        <h2 style="margin:3px 0">

          🎯 ${
            picks.length
              ? `Top ${picks.length} genuine common-ground careers`
              : 'No genuine common-ground career found yet'
          }

        </h2>

      </div>


      <span class="pill y">

        Test + Vault +
        ${acceptedConcerns.length}
        family answers

      </span>

    </div>


    <p class="muted small">

      These careers are not selected from generic family support.
      Each selected career must have evidence from the student side
      and career-specific evidence from the family side.

    </p>


    ${preferenceHTML}


    ${
      constraints.length
        ? `
          <div
            class="note small"
            style="margin-top:10px"
          >

            <b>Family concerns detected:</b>

            ${
              esc(
                [
                  ...new Set(
                    constraints.flatMap(
                      x=>x.dimensions
                    )
                  )
                ].join(' · ')
                ||
                'Specific concerns recorded'
              )
            }

            <br>

            These are treated as constraints,
            not automatic career preferences.

          </div>
        `
        : ''
    }


    ${
      neutralCount
        ? `
          <div
            class="muted small"
            style="margin-top:8px"
          >

            ${neutralCount}
            family answers were interpreted as
            general support or no constraint.

            They do not create artificial career points.

          </div>
        `
        : ''
    }


    ${
      picks.length

        ? `

          <div
            class="grid2"
            style="margin-top:12px"
          >

            ${picks.map((x,i)=>{

              const studentPct =
                Math.max(
                  1,
                  Math.min(
                    99,
                    Math.round(
                      (x.ss.fit/maxStudent)*100
                    )
                  )
                );


              const familyPct =
                Math.max(
                  1,
                  Math.min(
                    99,
                    Math.round(
                      (
                        Math.max(
                          0,
                          x.fs.score
                        ) / maxFamily
                      ) * 100
                    )
                  )
                );


              const overall =
                Math.max(
                  1,
                  Math.min(
                    99,
                    Math.round(
                      (
                        (x.ss.fit/maxStudent)*0.58 +
                        (
                          Math.max(
                            0,
                            x.fs.score
                          )/maxFamily
                        )*0.42
                      )*100
                    )
                  )
                );


              return `

              <div
                class="qa"
                style="margin:0"
              >


                <div class="row sp">

                  <b>
                    ${i+1}. ${esc(x.c.n)}
                  </b>

                  <span class="fit s">
                    ${overall}% evidence alignment
                  </span>

                </div>


                <p
                  class="small"
                  style="margin:7px 0"
                >

                  <b>Why it fits the student:</b>

                  ${
                    esc(
                      x.ss.evidence.join(' ')
                      ||
                      'Student evidence is limited.'
                    )
                  }

                </p>


                <div
                  class="note info small"
                  style="margin-top:8px"
                >

                  <b>
                    Family evidence supporting this career
                  </b>


                  ${
                    x.fs.matched.length

                      ? `
                        <ul
                          style="
                            margin:5px 0 0;
                            padding-left:18px
                          "
                        >

                          ${
                            x.fs.matched
                              .slice(0,6)
                              .map(m=>`

                                <li>

                                  <b>
                                    ${esc(m.label)}
                                  </b>

                                  —
                                  “${esc(
                                    m.a.slice(0,220)
                                  )}${m.a.length>220?'…':''}”

                                </li>

                              `)
                              .join('')
                          }

                        </ul>
                      `

                      : `

                        <div
                          style="margin-top:5px"
                        >
                          No career-specific family evidence found.
                        </div>

                      `
                  }

                </div>


                ${
                  x.fs.conflicts.length

                    ? `

                      <div
                        class="note bad small"
                        style="margin-top:8px"
                      >

                        <b>
                          Family conflict / trade-off
                        </b>

                        <ul
                          style="
                            margin:5px 0 0;
                            padding-left:18px
                          "
                        >

                          ${
                            x.fs.conflicts
                              .slice(0,4)
                              .map(v=>`

                                <li>

                                  ${esc(v.label)}
                                  —
                                  “${esc(
                                    v.a.slice(0,180)
                                  )}${v.a.length>180?'…':''}”

                                </li>

                              `)
                              .join('')
                          }

                        </ul>

                      </div>

                    `
                    : ''
                }


                ${
                  x.fs.context.length

                    ? `

                      <div
                        class="muted small"
                        style="margin-top:8px"
                      >

                        <b>Context only:</b>

                        Family support/no-constraint
                        answers were not counted as
                        career evidence.

                      </div>

                    `
                    : ''
                }


                <div
                  class="pc"
                  style="margin-top:10px"
                >

                  <div class="pros">

                    <h4>Pros</h4>

                    <ul>

                      ${x.c.pros
                        .map(v=>`
                          <li>${esc(v)}</li>
                        `)
                        .join('')}

                    </ul>

                  </div>


                  <div class="cons">

                    <h4>Cons / trade-offs</h4>

                    <ul>

                      ${x.c.cons
                        .map(v=>`
                          <li>${esc(v)}</li>
                        `)
                        .join('')}

                    </ul>

                  </div>

                </div>


                <h4
                  style="margin:12px 0 4px"
                >
                  Market, demand & pay
                </h4>


                <p
                  class="small"
                  style="margin:0"
                >
                  ${esc(x.c.mkt)}
                </p>


                <div
                  class="note info small"
                  style="margin-top:10px"
                >

                  <b>
                    Education & learning pathway
                  </b>

                  <br>

                  🎓 <b>Academic:</b>
                  ${esc(
                    learningPath(x.c).academic
                  )}

                  <br>

                  <b>Vocational / Diploma:</b>
                  ${esc(
                    learningPath(x.c).vocational
                  )}

                  <br>

                  <b>Certifications:</b>
                  ${learningPath(x.c)
                    .cert
                    .map(esc)
                    .join(', ')}

                  <br>

                  <b>Job-ready skills:</b>
                  ${learningPath(x.c)
                    .skills
                    .map(esc)
                    .join(', ')}

                </div>


                <div class="trait">

                  <span>
                    Student fit
                  </span>

                  <div class="bar">
                    <i
                      style="
                        width:${studentPct}%
                      "
                    ></i>
                  </div>

                  <span>
                    ${studentPct}%
                  </span>

                </div>


                <div class="trait">

                  <span>
                    Family evidence fit
                  </span>

                  <div class="bar">
                    <i
                      style="
                        width:${familyPct}%
                      "
                    ></i>
                  </div>

                  <span>
                    ${familyPct}%
                  </span>

                </div>


              </div>

              `;

            }).join('')}

          </div>

        `

        : `

          <div
            class="note bad"
            style="margin-top:12px"
          >

            <b>
              No career is being forced into the Top 3.
            </b>

            <br>

            The current student and family evidence
            does not produce three genuine overlaps.

            Review the Family Perspective or add
            clearer career-specific preferences/concerns.

          </div>

        `
    }


    <p
      class="muted small"
      style="margin-bottom:0"
    >

      Decision-support only.
      Explicit family preferences, real concerns,
      conflicts and generic support are kept separate
      so vague wording cannot create a fake high match.

    </p>


  </div>
  `;
}
</script>
