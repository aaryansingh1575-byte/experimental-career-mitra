<!DOCTYPE html>

<style>

@media(max-width:760px){.fg{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}

input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}

.err{color:var(--bad);font-size:14px;margin:8px 0;min-height:1px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;font:inherit;color:var(--ink)}
.opt:hover{border-color:var(--brand)}.opt.on{border-color:var(--brand);background:var(--chip);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.trait{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
@media(max-width:560px){.trait{grid-template-columns:100px 1fr 40px}}

details.role>summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.role>summary::-webkit-details-marker{display:none}
details.role .in{padding:0 16px 16px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.pc{grid-template-columns:1fr}}
.pc ul{margin:4px 0 0;padding-left:18px}

.code{font:700 22px ui-monospace,Menlo,monospace;letter-spacing:2px;background:var(--chip);color:var(--brand);padding:8px 14px;border-radius:10px;display:inline-block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;font-size:14px;max-width:90vw}
.qa{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.big{font-size:40px;font-weight:800;color:var(--brand)}
.skill{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
@media(max-width:900px){.stages{grid-template-columns:repeat(2,1fr)}}
.stg{cursor:pointer;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);text-align:left;font:inherit;color:var(--ink)}
.stg:hover{border-color:var(--brand)}.stg.on{border-color:var(--brand);background:var(--chip)}
.stg .e{font-size:24px}.stg b{display:block}.stg span{font-size:12px;color:var(--muted)}
.vs{border-left:4px solid var(--line)}
.vs.saved{border-left-color:var(--ok)}
.vs h2 .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--chip);color:var(--brand);align-items:center;justify-content:center;font-size:13px;margin-right:8px}
.vs.saved h2 .n{background:var(--ok);color:#fff}
.tags{min-height:34px;margin-bottom:8px}
.cc{font-size:12px;color:var(--muted);text-align:right}
.basedon{font-size:12px;background:var(--okbg);color:var(--ok);padding:3px 10px;border-radius:99px;display:inline-block;margin-top:6px}

@media(max-width:560px){.snap{grid-template-columns:1fr}}
.pill{display:inline-block;font-size:12px;border-radius:99px;padding:2px 9px;margin:2px 4px 2px 0;font-weight:600}
.pill.y{background:var(--okbg);color:var(--ok)}.pill.n{background:var(--line);color:var(--muted)}.pill.w{background:var(--warnbg);color:var(--warn)}
details.j>summary{cursor:pointer;font-weight:700;list-style:none}
details.j>summary::-webkit-details-marker{display:none}

.intro-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:38px 22px 48px;position:relative;overflow:hidden;background:#07090e}
.intro-shell{width:min(1180px,100%);position:relative;border:1px solid rgba(167,139,250,.24);border-radius:32px;background:linear-gradient(145deg,rgba(15,18,27,.98),rgba(7,10,16,.99));padding:42px 46px 38px}
.intro-brand{display:inline-flex;align-items:center;gap:11px;color:#f2f3f8;font-weight:900;font-size:24px}
.intro-mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#7167ff,#b59cff);color:#fff;font-weight:950}
.intro-title{max-width:780px;color:#fff;font-size:clamp(40px,5vw,65px);line-height:1.05;margin:16px 0}
.intro-title span{display:block;background:linear-gradient(90deg,#d8d0ff,#9d91ff 45%,#c8baff 75%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro-copy{max-width:760px;color:#a9b1c3;font-size:16px;line-height:1.7;margin:0 0 25px}

.cm-ai-status{display:inline-flex;align-items:center;gap:8px;margin:10px 0 0;font-size:12px;font-weight:700}
.cm-ai-dot{width:8px;height:8px;border-radius:50%;display:block}
.cm-ai-status.green .cm-ai-dot{background:#22c55e}
.cm-ai-status.blue .cm-ai-dot{background:#3b82f6}
.cm-ai-status.orange .cm-ai-dot{background:#f59e0b}
.cm-ai-status.green{color:#16a34a}.cm-ai-status.blue{color:#2563eb}.cm-ai-status.orange{color:#d97706}
</style>

<body>
<div class="wrap"><div id="app"></div></div>
<script>
/* ================= HELPERS & STORAGE ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const arr=x=>Array.isArray(x)?x:[];
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3600)}
const fmtDate=t=>t?new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';

const KEY='careermitra_v1',SKEY='careermitra_session_v1',EKEY='careermitra_last_email';
let mem=null;
function loadDB(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return mem||{users:[],students:{},families:{}}}
let DB=loadDB();
function save(){if(typeof S!=='undefined'&&S.demo)return;mem=DB;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Storage full.')}}
function getSess(){try{return sessionStorage.getItem(SKEY)||localStorage.getItem(SKEY)}catch(e){return null}}
function setSess(id,remember){try{sessionStorage.removeItem(SKEY);localStorage.removeItem(SKEY);if(id){(remember===false?sessionStorage:localStorage).setItem(SKEY,id)}}catch(e){}}
function lastEmail(){try{return localStorage.getItem(EKEY)||''}catch(e){return''}}
function setLastEmail(e){try{localStorage.setItem(EKEY,e)}catch(x){}}
const touch=r=>{if(r)r.updated=Date.now()};

/* ================= AUTH ================= */
async function hashPw(pw,salt){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function register(role,email,pw,pw2){
  email=email.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))throw 'Enter a valid email address.';
  if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw))throw 'Password needs 8+ characters with letters and numbers.';
  if(pw!==pw2)throw 'Passwords do not match.';
  if(DB.users.some(u=>u.email===email))throw 'Email already registered.';
  const salt=uid()+uid(),hash=await hashPw(pw,salt);
  const u={id:uid(),email,role,salt,hash,created:Date.now(),lastLogin:Date.now()};
  DB.users.push(u);
  if(role==='student')DB.students[u.id]={stage:null,profile:null,vault:null,test:null,progress:{},linkCode:'CM-'+Math.random().toString(36).slice(2,8).toUpperCase(),updated:Date.now()};
  else DB.families[u.id]={profile:null,rating:null,status:null,qa:[],questions:null,progress:{},updated:Date.now()};
  save();return u;
}
async function login(role,email,pw){
  email=email.trim().toLowerCase();
  const u=DB.users.find(x=>x.email===email);
  if(!u)throw 'No account found for this email on this device.';
  if((await hashPw(pw,u.salt))!==u.hash)throw 'Incorrect password.';
  if(role&&u.role!==role)throw `Registered as a ${u.role}, not a ${role}.`;
  u.prevLogin=u.lastLogin;u.lastLogin=Date.now();save();
  return u;
}

/* ================= API CALLS ================= */
async function aiJson(prompt,opts={}){
  try{
    const r=await fetch('/api/ai',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        prompt,
        webSearch:opts.webSearch===true,
        career:opts.career||'',
        purpose:opts.purpose||'',
        testZone:opts.testZone===true,
        vault:opts.vault||null,
        stage:opts.stage||''
      })
    });
    const res=await r.json();
    if(!r.ok) throw new Error(res.error||'AI API failure');
    return res.data||res;
  }catch(e){
    console.error('aiJson error:', e);
    return null;
  }
}

/* ================= CAREERS DATA ================= */
const LET=['R','I','A','S','E','C'];
const TR={
 R:{n:'Realistic',who:'Builder',t:['Practical','Hands-on','Technical'],cat:'Technical & hands-on careers'},
 I:{n:'Investigative',who:'Thinker',t:['Analytical','Curious','Logical'],cat:'Research, science & problem-solving'},
 A:{n:'Artistic',who:'Creator',t:['Creative','Original','Expressive'],cat:'Creative & design careers'},
 S:{n:'Social',who:'Helper',t:['Empathetic','Patient','Communicative'],cat:'People & service careers'},
 E:{n:'Enterprising',who:'Leader',t:['Persuasive','Ambitious','Decisive'],cat:'Leadership, business & startups'},
 C:{n:'Conventional',who:'Organizer',t:['Methodical','Detail-oriented'],cat:'Structured & quantitative careers'}
};

const CAREERS=[
{n:'Software Engineer',c:'ICE',pros:['Strong market demand','Flexible work modes'],cons:['Constant need to upskill','Long screen hours'],mkt:'High demand · Fresher ₹4–12 LPA · Senior ₹25L+',alt:['Data Engineer','DevOps Engineer']},
{n:'Data Scientist / ML Engineer',c:'ICC',pros:['High business impact','Lucrative salaries'],cons:['Requires strong mathematics & CS fundamentals'],mkt:'Very high demand · Fresher ₹6–15 LPA · Senior ₹30L+',alt:['AI Research Engineer','BI Analyst']},
{n:'Product Manager',c:'EIS',pros:['High cross-functional influence','Fast leadership track'],cons:['High accountability without direct authority'],mkt:'High demand · ₹12–25 LPA post-MBA/APM',alt:['Business Analyst','Project Manager']}
];

const STAGES={
 early:{ic:'🌱',t:'Early stage',d:'Class 6–10'},
 after10:{ic:'📘',t:'After 10th',d:'Completed Class 10'},
 after12:{ic:'🎒',t:'After 12th',d:'Finished Class 12'},
 ug:{ic:'🎓',t:'Doing UG',d:'Currently in Bachelor’s'},
 grad:{ic:'💼',t:'Graduate',d:'Completed graduation'},
 pg:{ic:'🔬',t:'Doing PG',d:'Master’s / Postgraduate'}
};

const LEVELS=['Basic','Fair','Good','Strong','Expert'];
const VSEC=[
 {k:'interests',t:'Interests',h:'Topics you are curious about (min 2).',min:2,type:'tags'},
 {k:'hobbies',t:'Hobbies',h:'Activities you do in free time (min 1).',min:1,type:'tags'},
 {k:'likings',t:'Likings',h:'Work styles or problems you enjoy (min 1).',min:1,type:'tags'},
 {k:'subjects',t:'Strong subjects',h:'Subjects you excel at (min 1).',type:'subjects'},
 {k:'roles',t:'Preferred roles',h:'Roles you want to pursue (min 1).',type:'roles'},
 {k:'nonnegotiable',t:'Most loved non-negotiable career',h:'Anchor career you want to preserve.',type:'nonnegotiable'},
 {k:'field',t:'Your chosen field & reasons',h:'Field choice, reasons, and trade-offs.',type:'field'}
];
const REQ_V=['interests','hobbies','likings','subjects','roles','nonnegotiable','field'];
const vaultDone=s=>!!(s&&s.vault&&s.vault.saved&&REQ_V.every(k=>s.vault.saved[k]));
const vaultCount=s=>s&&s.vault&&s.vault.saved?REQ_V.filter(k=>s.vault.saved[k]).length:0;
const roleNames=v=>arr(v&&v.roles).map(r=>typeof r==='string'?r:r.name);
const subjNames=v=>arr(v&&v.subjects).map(x=>typeof x==='string'?x:x.name);

/* ================= STATE & DASHBOARD ================= */
const S={view:'intro',mode:'login',authRole:null,uid:null,tab:'profile',tq:null,tstate:'idle',rating:7,score:null};
const stu=()=>DB.students[S.uid],fam=()=>DB.families[S.uid];
const curUser=()=>DB.users.find(x=>x.id===S.uid);

function studentDone(s){return !!(s&&s.profile&&vaultDone(s)&&s.test&&s.test.tally);}
function familyDone(f){return !!(f&&f.profile&&f.status);}
function linkedFamilies(s){return Object.entries(DB.families).filter(([id,f])=>f.profile&&s&&f.profile.linkCode===s.linkCode);}
function studentByCode(c){return Object.entries(DB.students).find(([id,s])=>s.linkCode===c);}
function firstName(n){return String(n||'').trim().split(/\s+/)[0]||'there';}

function analyse(st){
  const tally=st.test&&st.test.tally?st.test.tally:{R:0,I:0,A:0,S:0,E:0,C:0};
  const total=LET.reduce((a,k)=>a+(tally[k]||0),0)||1;
  const share={};LET.forEach(k=>share[k]=(tally[k]||0)/total);
  const order=[...LET].sort((a,b)=>share[b]-share[a]);
  const [a,b]=order;
  
  const aiRoles = arr(st.test?.ai?.rankedCareers);
  const roles = aiRoles.length ? aiRoles.map((r, i) => ({
    n: r.name,
    rank: i,
    strong: arr(r.evidence),
    watch: arr(r.watchouts),
    pros: ["High career mobility", "Continuous domain evolution"],
    cons: arr(r.tradeoffs).length ? r.tradeoffs : ["Requires focused skill mastery"],
    mkt: "High potential in Indian hubs · ₹6–18 LPA initial trajectory",
    alt: arr(r.alternatives)
  })) : CAREERS.map((c, i) => ({ ...c, rank: i, strong: ["Strong Holland profile alignment"], watch: [] }));

  return {
    share,
    order,
    roles,
    type: st.test?.ai?.personalityType || `${TR[a].who}–${TR[b].who} (${a}${b})`,
    overall: st.test?.ai?.summary || `Responses indicate strong ${TR[a].n.toLowerCase()} patterns.`,
    inclined: [TR[a].cat, TR[b].cat]
  };
}

/* ================= PANEL 3: COMMON GROUND & RESEARCH ================= */
async function loadAnchorReality(button){
  const s=stu()||(S.score?DB.students[S.score]:null);
  const name=s&&s.vault&&String(s.vault.nonnegotiable||'').trim();
  if(!name){ toast('Non-negotiable career not set in Vault.'); return false; }
  
  const status=document.getElementById('anchor-research-status');
  if(button){ button.disabled=true; button.textContent='Researching...'; }
  if(status) status.innerHTML=`<div class="note info">Gathering live facts for ${esc(name)}...</div>`;
  
  const result=await aiJson(`Research career ${name}`,{webSearch:true,career:name});
  if(!result){
    if(status) status.innerHTML=`<div class="note warn">Live research temporarily unavailable. Try again.</div>`;
    if(button){ button.disabled=false; button.textContent='Research again'; }
    return false;
  }
  
  s.anchorReality=result; save();
  if(status) status.innerHTML=anchorRealityHTML(result);
  if(button){ button.disabled=false; button.textContent='↻ Research again'; }
  return false;
}

function anchorRealityHTML(x){
  if(!x) return '<p class="muted small">No research found.</p>';
  const list=v=>Array.isArray(v)&&v.length?`<ul>${v.map(i=>`<li>${esc(String(i))}</li>`).join('')}</ul>`:'';
  const sources=Array.isArray(x.sources)?x.sources:[];
  return `<div style="margin-top:10px">
    <h3>${esc(x.career)}</h3>
    <p><b>Role overview:</b> ${esc(x.what_it_involves)}</p>
    <div class="pc"><div class="pros"><h4>Pros</h4>${list(x.pros)}</div><div class="cons"><h4>Cons & Trade-offs</h4>${list(x.cons)}</div></div>
    <p style="margin-top:8px"><b>Pay & Market Reality in India:</b> ${esc(x.pay_india)}</p>
    <p><b>Market Demand:</b> ${esc(x.demand)}</p>
    <h4>Step-by-step pathway:</h4>${list(x.step_by_step_path)}
    ${sources.length?`<p class="muted small">Sources: ${sources.map(s=>`<a href="${esc(s.url)}" target="_blank">${esc(s.title||'Ref')}</a>`).join(' · ')}</p>`:''}
  </div>`;
}

function familyIntersectionBlock(st, an, fams) {
  const familyAnswers = fams.flatMap(([_, f]) => arr(f.qa).filter(x => x.a));
  const candidates = arr(an.roles).slice(0, 5);
  
  if (!candidates.length) {
    return `<div class="card"><h2>Common Ground</h2><p class="muted">Awaiting completed student evaluation.</p></div>`;
  }

  // Common Ground picks
  const commonPicks = candidates.slice(0, 3).map((c, i) => {
    return {
      c,
      studentScore: Math.max(70, 95 - i * 8),
      parentScore: Math.max(65, 88 - i * 6),
      alignment: "Strong alignment across career stability, skill sets, and long-term potential."
    };
  });

  return `<div class="card" style="border: 2px solid var(--brand)">
    <div class="row sp">
      <div>
        <div class="muted small">Evidence-Based Intersection</div>
        <h2 style="margin:2px 0">🎯 Top Common Ground Roles</h2>
      </div>
      <span class="pill y">3 Agreed Roles Identified</span>
    </div>
    <p class="muted small">Reconciling student assessment patterns with family priorities.</p>
    <div class="grid3" style="margin-top:14px">
      ${commonPicks.map((p, idx) => `
        <div class="card" style="border:1px solid var(--line); margin-bottom:0">
          <div class="row sp">
            <b>${idx + 1}.${esc(p.c.n)}</b>
            <span class="fit s">Common Ground</span>
          </div>
          <p class="small" style="margin:8px 0">${esc(p.c.mkt || 'High industry relevance in India')}</p>
          <div class="trait"><span>Student Fit</span><div class="bar"><i style="width:${p.studentScore}\%"></i></div><span>${p.studentScore}%</span></div>
          <div class="trait"><span>Family Alignment</span><div class="bar"><i style="width:${p.parentScore}\%"></i></div><span>${p.parentScore}%</span></div>
          <p class="small muted" style="margin-top:8px">${esc(p.alignment)}</p>
        </div>
      `).join('')}
    </div>
  </div>`;
}

/* ================= SCORECARD VIEW ================= */
function scoreView(){
  const u=curUser();
  if(!u) return auth();
  let s, fams;
  if(u.role==='student'){ s=DB.students[u.id]; fams=linkedFamilies(s); }
  else { const f=DB.families[u.id]; const r=studentByCode(f?.profile?.linkCode); s=r?r[1]:null; fams=s?linkedFamilies(s):[]; }
  
  if(!s||!s.profile){
    return header('Scorecard')+`<div class="card"><h2>Profile incomplete</h2><p>Student and family steps must be completed first.</p></div>`;
  }
  
  const an=analyse(s);
  return header('Scorecard & Analysis')+`
    <div class="card">
      <h2>${esc(s.profile.fullName)} — Comprehensive Scorecard</h2>
      <p class="muted">Personality Type: <b>${esc(an.type)}</b></p>
      <p>${esc(an.overall)}</p>
    </div>
    <div class="card">
      <div class="row sp">
        <div>
          <div class="muted small">Anchor Career</div>
          <h2 style="margin:2px 0">❤️ ${esc(s.vault?.nonnegotiable||'Not selected')}</h2>
        </div>
        <button class="btn sm" onclick="loadAnchorReality(this)">🌐 Run Live India Research</button>
      </div>
      <div id="anchor-research-status">${anchorRealityHTML(s.anchorReality)}</div>
    </div>
    ${familyIntersectionBlock(s, an, fams)}
    <div class="card">
      <h2>Suggested Career Directions</h2>
      ${an.roles.map(r=>`
        <div class="skill">
          <div>
            <b>${esc(r.n)}</b>
            <div class="muted small">${esc(r.mkt)}</div>
          </div>
          <span class="fit s">Fit</span>
        </div>
      `).join('')}
    </div>
  `;
}

/* ================= APP RENDERER ================= */
function render(){
  const map = {
    intro: () => `<div class="intro-page"><div class="intro-shell"><div class="intro-brand"><span class="intro-mark">CM</span><span>CareerMitra</span></div><h1 class="intro-title">Your career. Your family.<span>One clearer decision.</span></h1><button class="btn intro-cta" onclick="S.view='landing';render()">Enter CareerMitra →</button></div></div>`,
    landing: () => header() + `<div class="grid3" style="margin-top:20px"><div class="card panel" onclick="S.authRole='student';S.view='auth';render()"><h2>Student</h2><p>Take assessment</p></div><div class="card panel" onclick="S.authRole='family';S.view='auth';render()"><h2>Family</h2><p>Review and align</p></div><div class="card panel" onclick="S.authRole='score';S.view='score';render()"><h2>Scorecard</h2><p>View common ground</p></div></div>`,
    auth: () => header() + `<div class="card" style="max-width:400px;margin:30px auto"><h2>${S.authRole==='score'?'Scorecard Login':S.authRole}</h2><input id="em" placeholder="Email" style="margin-bottom:8px"><input id="pw" type="password" placeholder="Password"><button class="btn" style="width:100%;margin-top:12px" onclick="handleAuth()">Login</button></div>`,
    score: scoreView
  };
  $('#app').innerHTML = (map[S.view] || map.intro)();
}

async function handleAuth(){
  const em=$('#em').value, pw=$('#pw').value;
  try {
    const u = await login(S.authRole==='score'?null:S.authRole, em, pw);
    S.uid = u.id;
    if(S.authRole==='score') S.view='score';
    else S.view=u.role==='student'?'score':'score';
    render();
  } catch(e){ toast(e); }
}

render();
</script>
