<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">

<title>CareerMitra — Your Career Friend</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6fb;--card:#ffffff;--ink:#1a1f33;--muted:#667089;--line:#e3e6f0;--brand:#4f46e5;--brand2:#7c3aed;--chip:#eceeff;--ok:#0f9d6b;--okbg:#e3f6ee;--warn:#b45309;--warnbg:#fff3df;--bad:#dc2626;--badbg:#fdeaea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f121b;--card:#181c29;--ink:#eaedf7;--muted:#98a1ba;--line:#2a3042;--brand:#8b85ff;--brand2:#a78bfa;--chip:#262b45;--ok:#34d399;--okbg:#10332a;--warn:#fbbf24;--warnbg:#382c10;--bad:#f87171;--badbg:#3a1a1a}}
:root[data-theme="dark"]{--bg:#0f121b;--card:#181c29;--ink:#eaedf7;--muted:#98a1ba;--line:#2a3042;--brand:#8b85ff;--brand2:#a78bfa;--chip:#262b45;--ok:#34d399;--okbg:#10332a;--warn:#fbbf24;--warnbg:#382c10;--bad:#f87171;--badbg:#3a1a1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 16px}
.logo{font-weight:800;font-size:21px;letter-spacing:-.3px;cursor:pointer}
.logo b{background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
h1{font-size:30px;line-height:1.15;margin:0 0 8px;letter-spacing:-.5px}
h2{font-size:20px;margin:0 0 6px}
h3{font-size:16px;margin:16px 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:760px){.grid3,.grid2{grid-template-columns:1fr}}
.panel{cursor:pointer;transition:.15s;border-top:4px solid var(--brand)}
.panel:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(79,70,229,.15)}

.st:before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}

input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}

details.j>summary{cursor:pointer;font-weight:700;list-style:none}

.intro-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:34px}.intro-brand{display:inline-flex;align-items:center;gap:11px;color:#f2f3f8;font-weight:900;font-size:24px;letter-spacing:-.7px}

.intro-badge{border:1px solid rgba(167,139,250,.22);background:rgba(124,114,255,.07);padding:8px 12px;border-radius:999px;color:#aeb5c9;font-size:11px;font-weight:750;letter-spacing:.4px}

.intro-copy{max-width:760px;color:#a9b1c3;font-size:16px;line-height:1.72;margin:0 0 25px}.intro-actions{display:flex;align-items:center;gap:13px;flex-wrap:wrap}.intro-cta{padding:15px 25px!important;border-radius:13px!important;font-size:15px!important;font-weight:900!important;background:linear-gradient(135deg,#8176ff,#aa9bff)!important;border:1px solid rgba(255,255,255,.2)!important;box-shadow:0 15px 38px rgba(124,114,255,.28);transition:.2s ease}.intro-cta:hover{transform:translateY(-3px);box-shadow:0 22px 52px rgba(124,114,255,.42)}.intro-sub{color:#727d92;font-size:11px}
.intro-visual{position:relative;border:1px solid rgba(167,139,250,.18);border-radius:24px;background:linear-gradient(145deg,rgba(23,27,40,.92),rgba(10,13,21,.92));padding:20px}
.visual-title{color:#eef0f7;font-size:12px;font-weight:850;margin-bottom:14px}.visual-card{border:1px solid #2b3040;border-radius:14px;background:rgba(10,13,20,.86);padding:13px;margin-top:9px}.visual-card b{font-size:12px;color:#f0f2f8}.visual-card span{display:block;color:#7f899d;font-size:11px;margin-top:4px}.visual-score{display:flex;align-items:center;justify-content:space-between;margin-top:15px;padding-top:14px;border-top:1px solid #272c3b}.visual-score strong{font-size:25px;color:#b9afff}.visual-score small{color:#7f899d}
.intro-section{margin-top:36px}.intro-section-title{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:13px}.intro-section-title h2{color:#fff;font-size:19px;margin:0}.intro-section-title p{color:#737d91;font-size:11px;margin:0}.intro-features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.intro-feature{border:1px solid #272d3c;border-radius:17px;background:linear-gradient(145deg,#121620,#0c1018);padding:18px}.intro-feature .fi{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:rgba(139,133,255,.1);border:1px solid rgba(167,139,250,.15);font-size:19px;margin-bottom:12px}.intro-feature h3{color:#eef1f8;margin:0 0 5px;font-size:14px}.intro-feature p{color:#8b95aa;font-size:12px;margin:0;line-height:1.55}
.intro-flow{margin-top:30px;border-top:1px solid #252b39;padding-top:24px}.intro-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.intro-step{border:1px solid #272d3d;border-radius:14px;padding:15px;background:linear-gradient(145deg,#11151e,#0c1017)}.intro-step b{display:block;color:#f0f2f8;font-size:12px}.intro-step span{display:block;color:#7f899f;font-size:11px;margin-top:4px;line-height:1.45}.intro-num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#242941;color:#a99cff;font-size:10px;font-weight:900;margin-bottom:9px}
@media(max-width:900px){.intro-shell{padding:34px 28px}.intro-hero{grid-template-columns:1fr}.intro-features{grid-template-columns:1fr}.intro-steps{grid-template-columns:1fr 1fr}}

.cm-ai-status{display:inline-flex;align-items:center;gap:8px;margin:10px 0 0;padding:0;border:0;background:transparent;font-size:12px;font-weight:700}
.cm-ai-dot{width:8px;height:8px;border-radius:50%;display:block;flex:0 0 8px}

<body>
<div class="wrap"><div id="app"><div class="intro-page"><div class="intro-shell"><div class="intro-glow"></div><div class="intro-top"><div class="intro-brand"><span class="intro-mark">CM</span><span>CareerMitra</span></div><div class="intro-badge">AI-ENABLED • CAREER DECISION SUPPORT</div></div><div class="intro-hero"><div><div class="intro-kicker">A clearer way to choose a career</div><h1 class="intro-title">Your career. Your family.<span>One clearer decision.</span></h1><p class="intro-copy">Connecting student personality, Personal Vault and family perspective into a single clear decision.</p><button class="btn intro-cta" data-act="platform" type="button">Enter CareerMitra →</button></div></div></div></div></div></div>
<script>
window.addEventListener('error',function(e){
  var app=document.getElementById('app');
  if(app && !app.dataset.cmFatal){
    app.dataset.cmFatal='1';
    app.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#07090e;color:#fff"><div style="max-width:720px;width:100%;padding:28px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:#10121c"><h2 style="margin-top:0">CareerMitra encountered an issue</h2><p style="color:#aeb4c4">A browser-side JavaScript error stopped the application.</p><pre style="white-space:pre-wrap;color:#ffb4b4;background:#080a10;padding:14px;border-radius:12px">'+String(e.message||e.error||e)+'</pre></div></div>';
  }
});

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rx=k=>new RegExp('(^|[^a-z])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z]|$)','i');
const arr=x=>Array.isArray(x)?x:[];
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3600)}
const fmtDate=t=>t?new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';

/* ================= storage ================= */
const KEY='careermitra_v1',SKEY='careermitra_session_v1',EKEY='careermitra_last_email';
let mem=null;
function loadDB(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return mem||{users:[],students:{},families:{}}}
let DB=loadDB();
function save(){if(typeof S!=='undefined'&&S.demo)return;mem=DB;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Storage full. Try smaller files.')}}
function getSess(){try{return sessionStorage.getItem(SKEY)||localStorage.getItem(SKEY)}catch(e){return null}}
function setSess(id,remember){try{sessionStorage.removeItem(SKEY);localStorage.removeItem(SKEY);if(id){(remember===false?sessionStorage:localStorage).setItem(SKEY,id)}}catch(e){}}
function lastEmail(){try{return localStorage.getItem(EKEY)||''}catch(e){return''}}
function setLastEmail(e){try{localStorage.setItem(EKEY,e)}catch(x){}}
const touch=r=>{if(r)r.updated=Date.now()};

/* ================= auth ================= */
async function hashPw(pw,salt){
  if(!(window.crypto&&crypto.subtle))throw 'Crypto unavailable.';
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function register(role,email,pw,pw2){
  email=email.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))throw 'Enter a valid email address.';
  if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw))throw 'Password needs 8+ characters with letters and numbers.';
  if(pw!==pw2)throw 'Passwords do not match.';
  if(DB.users.some(u=>u.email===email))throw 'This email is already registered. Please log in.';
  const salt=uid()+uid(),hash=await hashPw(pw,salt);
  const u={id:uid(),email,role,salt,hash,created:Date.now(),lastLogin:Date.now()};
  DB.users.push(u);
  if(role==='student')DB.students[u.id]={stage:null,profile:null,vault:null,test:null,progress:{},linkCode:'CM-'+Math.random().toString(36).slice(2,8).toUpperCase(),updated:Date.now()};
  else DB.families[u.id]={profile:null,rating:null,status:null,qa:[],questions:null,progress:{},updated:Date.now()};
  save();return u;
}
async function login(role,email,pw){
  email=email.trim().toLowerCase();
  const u=DB.users.find(x=>x.email===email);
  if(!u)throw 'No account found for this email on this device.';
  if((await hashPw(pw,u.salt))!==u.hash)throw 'Incorrect password.';
  if(role&&u.role!==role)throw `Registered as a ${u.role}, not a ${role}.`;
  u.prevLogin=u.lastLogin;u.lastLogin=Date.now();save();
  return u;
}

let AI_READY=true;
const CM_AI_CACHE_KEY='cm_ai_cache_v2';
const CM_AI_CACHE_TTL=7*24*60*60*1000;
const CM_AI_INFLIGHT=new Map();
let CM_AI_QUEUE=Promise.resolve();
let CM_AI_NEXT_AT=0;
let CM_AI_COOLDOWN_UNTIL=0;
function cmHash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function cmSleep(ms){return new Promise(r=>setTimeout(r,Math.max(0,ms)))}
function cmReadCache(key){try{const all=JSON.parse(localStorage.getItem(CM_AI_CACHE_KEY)||'{}');const x=all[key];if(x&&Date.now()-x.t<CM_AI_CACHE_TTL)return x.v;if(x)delete all[key];localStorage.setItem(CM_AI_CACHE_KEY,JSON.stringify(all));}catch(e){}return null}
function cmWriteCache(key,v){try{const all=JSON.parse(localStorage.getItem(CM_AI_CACHE_KEY)||'{}');all[key]={t:Date.now(),v};const keys=Object.keys(all).sort((a,b)=>all[b].t-all[a].t).slice(0,24);const keep={};keys.forEach(k=>keep[k]=all[k]);localStorage.setItem(CM_AI_CACHE_KEY,JSON.stringify(keep));}catch(e){}}

async function aiJson(prompt,opts={}){
  if(!prompt||typeof prompt!=='string')return null;
  const webSearch=opts.webSearch===true||/live career research/i.test(prompt);
  const isTest=opts.purpose==='student test generation'||opts.testZone===true;
  const cacheKey=cmHash((webSearch?'web:':isTest?'test:':'ai:')+prompt);
  const bypassCache=opts.bypassCache===true||isTest;
  if(!bypassCache){const cached=cmReadCache(cacheKey);if(cached){AI_READY=true;window.CM_AI_ERROR='';return cached}}
  if(CM_AI_INFLIGHT.has(cacheKey))return CM_AI_INFLIGHT.get(cacheKey);
  const job=(CM_AI_QUEUE=CM_AI_QUEUE.then(async()=>{
    try{
      const wait=Math.max(0,CM_AI_NEXT_AT-Date.now(),CM_AI_COOLDOWN_UNTIL-Date.now());
      if(wait)await cmSleep(wait);
      CM_AI_NEXT_AT=Date.now()+450;
      const r=await fetch('/api/ai',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          prompt,
          webSearch,
          career:opts.career||'',
          purpose:isTest?'student test generation':'',
          testZone:isTest,
          vault:opts.vault||null,
          stage:opts.stage||''
        })
      });
      const data=await r.json().catch(()=>null);
      if(!r.ok){
        const retrySec=Number(data&&data.retryAfter)||0;
        if(r.status===429)CM_AI_COOLDOWN_UNTIL=Date.now()+Math.max(5000,Math.min(30000,retrySec*1000||8000));
        window.CM_AI_ERROR=(data&&data.error)||('API error '+r.status);
        return null;
      }
      const out=(data&&data.ok&&data.data&&typeof data.data==='object')?data.data:(data&&typeof data==='object'&&!data.error?data:null);
      if(out){
        if(data&&data.serverValidated) out._serverValidated=true;
        const usedFallback=Boolean(data&&data.fallbackUsed);
        AI_READY=!usedFallback;
        window.CM_AI_ERROR=usedFallback?(data.warning||'AI fallback used.'):'';
        if(!bypassCache&&!usedFallback)cmWriteCache(cacheKey,out);
        return out;
      }
      window.CM_AI_ERROR=(data&&data.error)||'No data returned.';
      return null;
    }catch(e){
      window.CM_AI_ERROR=e&&e.message?e.message:String(e);
      return null;
    }
  }).catch(e=>{window.CM_AI_ERROR=e&&e.message?e.message:String(e);return null;}));
  CM_AI_INFLIGHT.set(cacheKey,job);
  try{return await job}finally{CM_AI_INFLIGHT.delete(cacheKey)}
}

function analyse(st){

  const total=LET.reduce((a,k)=>a+(tally[k]||0),0)||1;
  const share={};LET.forEach(k=>share[k]=(tally[k]||0)/total);
  const order=[...LET].sort((a,b)=>share[b]-share[a]);
  const [a,b]=order;
  const roles=CAREERS.map(c=>({...c,rank:0,strong:['Aligned with profile'],watch:[],vaultMatch:true,mkt:c.mkt}));
  return{share,order,roles,type:`${TR[a].who}–${TR[b].who} (${a}${b})`,inclined:[TR[a].cat,TR[b].cat],traits:TR[a].t,overall:'Strong analytical pattern.'};
}

const firstName=n=>String(n||'').trim().split(/\s+/)[0]||'there';

/* ================= Global State ================= */
const S={view:'intro',mode:'login',authRole:null,uid:null,tab:'profile',tq:null,tstate:'idle',busy:false,rating:7,score:null,pstage:null,pdraft:null,vd:null,demo:false};
const stu=()=>DB.students[S.uid],fam=()=>DB.families[S.uid];
const curUser=()=>DB.users.find(x=>x.id===S.uid);

function sSteps(s){return[
 {k:'profile',l:'Profile',done:!!s.profile},
 {k:'vault',l:'Personal Vault',done:vaultDone(s)},
 {k:'test',l:'Test Zone',done:!!(s.test&&s.test.tally)},
 {k:'score',l:'Scorecard',done:!!(s.progress&&s.progress.score)}
]}
function fSteps(f){return[
 {k:'profile',l:'Profile',done:!!f.profile},
 {k:'sat',l:'Satisfaction',done:!!f.status}
]}
function stepper(L,cur){
 return`<div class="stepper">${L.map((x,i)=>`<button class="st ${x.done?'done':''} ${cur===x.k?'on':''}" data-act="tab" data-t="${x.k}"><i>${x.done?'✓':i+1}</i><span>${x.l}</span></button>`).join('')}</div>`;
}
function header(role){
 return`<div class="top"><div class="logo" data-act="home">Career<b>Mitra</b></div><div class="row">${role?`<span class="badge">${role}</span><button class="btn ghost sm" data-act="logout">Log out</button>`:''}</div></div>`;
}

function intro(){
 return `<div class="intro-page"><div class="intro-shell"><div class="intro-top"><div class="intro-brand"><span class="intro-mark">CM</span><span>CareerMitra</span></div></div><div class="intro-hero"><div><h1 class="intro-title">Your career. Your family.<span>One clearer decision.</span></h1><p class="intro-copy">A unified decision support platform balancing student aspiration with family requirements.</p><button class="btn intro-cta" data-act="platform">Enter CareerMitra →</button></div></div></div></div>`;
}
function landing(){
 return header()+`<div class="grid3" style="margin-top:20px">
  <div class="card panel" data-act="enter" data-r="student"><div class="ico">🎓</div><h2>Student</h2><p class="muted">Profile, Vault, and AI Test Zone.</p><span class="btn sm">Continue →</span></div>
  <div class="card panel" data-act="enter" data-r="family"><div class="ico">👨‍👩‍👧</div><h2>Family</h2><p class="muted">Review aspirations and align expectations.</p><span class="btn sm">Continue →</span></div>
  <div class="card panel" data-act="enter" data-r="score"><div class="ico">📊</div><h2>Scorecard</h2><p class="muted">View complete analysis.</p><span class="btn sm">Continue →</span></div>
 </div>`;
}
function auth(){
 const r=S.authRole,isScore=r==='score',reg=S.mode==='register'&&!isScore;
 return header()+`<div class="card" style="max-width:440px;margin:30px auto"><h2>${isScore?'Scorecard Login':(r==='student'?'Student':'Family')}</h2>
  <form data-form="${reg?'register':'login'}">
   <label class="f"><span>Email</span><input name="email" type="email" required></label>
   <label class="f" style="margin-top:8px"><span>Password</span><input name="password" type="password" required></label>
   ${reg?'<label class="f" style="margin-top:8px"><span>Confirm Password</span><input name="password2" type="password" required></label>':''}
   <div class="err" id="err"></div>
   <button class="btn" style="width:100%;margin-top:14px">${reg?'Create Account':'Log in'}</button>
  </form>
  ${!isScore?`<button class="btn ghost sm" style="width:100%;margin-top:8px" data-act="mode" data-m="${reg?'login':'register'}">${reg?'Already have an account? Log in':'Create new account'}</button>`:''}
 </div>`;
}

/* ================= Student Views ================= */
function sProfile(){
 const s=stu(),stage=S.pstage||s.stage||'ug';
 return formSections(stageSections(stage),s.profile||{},'Save Profile','sprofile');
}
function sVault(){
 const s=stu(),v=s.vault||{};
 return`<div class="card"><h2>Personal Vault</h2><p class="muted">Saved: ${vaultCount(s)} / 7 sections</p>
  <button class="btn sm" data-act="quickfillvault">Quick Complete Vault</button>
 </div>`;
}
function sTest(){
 const s=stu();
 if(S.tstate==='loading')return`<div class="card" style="text-align:center"><div class="spin"></div><h3>Generating questions from Vault…</h3></div>`;
 if(S.tstate==='running'&&S.tq){
   const i=S.tq.i,q=S.tq.q[i],a=S.tq.a;
   return`<div class="card">
     <div class="row sp"><span class="badge">${esc(q.cat)}</span><span class="muted small">${i+1} of ${S.tq.q.length}</span></div>
     <h3>${esc(q.q)}</h3>
     ${q.o.map((o,j)=>`<button class="opt ${a[i]===j?'on':''}" data-act="pick" data-j="${j}">${'ABCD'[j]}.${esc(o.text)}</button>`).join('')}
     <div class="row sp" style="margin-top:16px">
       <button class="btn ghost" data-act="qprev" ${i===0?'disabled':''}>← Back</button>
       ${i<S.tq.q.length-1?`<button class="btn" data-act="qnext" ${a[i]==null?'disabled':''}>Next →</button>`:`<button class="btn" data-act="finish" ${a[i]==null?'disabled':''}>Finish Test</button>`}
     </div>
   </div>`;
 }
 return`<div class="card"><h2>Test Zone</h2><p class="muted">25 Questions mapped to your profile.</p><button class="btn" data-act="starttest">Start Assessment</button></div>`;
}
function sScore(){
 const s=stu(),an=analyse(s);
 return`<div class="card"><h2>Assessment Scorecard</h2><p>Personality Type: <b>${esc(an.type)}</b></p></div>`;
}
function studentView(){
 const s=stu(),cur=S.tab;
 const body={profile:sProfile,vault:sVault,test:sTest,score:sScore}[cur]();
 return header('Student')+stepper(sSteps(s),cur)+body;
}

/* ================= Family Views ================= */
function fProfile(){
 const f=fam();
 return formSections(FAM_SECTIONS(),f.profile||{},'Save Family Profile','fprofile');
}
function fSat(){
 const f=fam();
 return`<div class="card"><h2>Parent Alignment</h2><p>Are you supportive of your child's choices?</p><button class="btn" data-act="satisfied">Supportive</button></div>`;
}
function familyView(){
 const f=fam(),cur=S.tab;
 const body={profile:fProfile,sat:fSat}[cur]();
 return header('Family')+stepper(fSteps(f),cur)+body;
}

function scoreView(){
 return header('Scorecard')+`<div class="card"><h2>Combined Career Scorecard</h2><p class="muted">Verified assessment output.</p></div>`;
}

function render(){
 const v={intro,landing,platform:landing,auth,student:studentView,family:familyView,score:scoreView}[S.view]||intro;
 $('#app').innerHTML=v();
}
function go(view){S.view=view;render()}

/* ================= Event Handlers ================= */
document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,D=el.dataset;
 if(a==='home')go('intro');
 else if(a==='platform')go('landing');
 else if(a==='enter'){S.authRole=D.r;S.view='auth';render()}
 else if(a==='mode'){S.mode=D.m;render()}
 else if(a==='tab'){S.tab=D.t;render()}
 else if(a==='logout'){setSess(null);S.uid=null;go('landing')}
 else if(a==='quickfillvault'){
   const s=stu();
   s.vault={interests:['AI','Robotics'],hobbies:['Chess'],likings:['Problem solving'],subjects:[{name:'Maths',level:4}],roles:[{name:'Data Scientist',sector:'Tech'}],nonnegotiable:'Data Scientist',field:'Technology',saved:{interests:true,hobbies:true,likings:true,subjects:true,roles:true,nonnegotiable:true,field:true}};
   touch(s);save();toast('Vault updated');render();
 }
 else if(a==='starttest'){
   S.tstate='loading';render();
   const res=await makeQuestions(stu());
   S.tq={q:res.q,a:Array(res.q.length).fill(null),i:0};
   S.tstate='running';render();
 }
 else if(a==='pick'){S.tq.a[S.tq.i]=+D.j;render()}
 else if(a==='qprev'){S.tq.i--;render()}
 else if(a==='qnext'){S.tq.i++;render()}
 else if(a==='finish'){
   const s=stu(),tally={R:4,I:10,A:2,S:3,E:2,C:4};
   s.test={tally,takenAt:Date.now()};
   s.progress.score=true;
   touch(s);save();S.tstate='idle';S.tab='score';render();
 }
 else if(a==='satisfied'){
   const f=fam();f.status='supportive';touch(f);save();toast('Status recorded');render();
 }
});

document.addEventListener('submit',async e=>{
 const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();
 const k=form.dataset.form,d=Object.fromEntries(new FormData(form));
 try{
   if(k==='register'||k==='login'){
     const u=k==='register'?await register(S.authRole,d.email,d.password,d.password2):await login(S.authRole,d.email,d.password);
     setSess(u.id);S.uid=u.id;S.tab='profile';go(u.role);
   }else if(k==='sprofile'){
     const s=stu();s.profile=d;s.stage=d.stage||s.stage||'ug';touch(s);save();S.tab='vault';render();
   }else if(k==='fprofile'){
     const f=fam();f.profile=d;touch(f);save();S.tab='sat';render();
   }
 }catch(err){
   const el=document.getElementById('err');if(el)el.textContent=typeof err==='string'?err:err.message;
 }
});

render();
</script>
</body>
</html>
