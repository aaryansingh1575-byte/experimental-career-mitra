<script>
window.addEventListener('error',function(e){
  var app=document.getElementById('app');
  if(app && !app.dataset.cmFatal){
    app.dataset.cmFatal='1';
    app.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#07090e;color:#fff"><div style="max-width:720px;width:100%;padding:28px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:#10121c"><h2>CareerMitra error</h2><pre style="white-space:pre-wrap;color:#ffb4b4;background:#080a10;padding:14px;border-radius:12px">'+String(e.message||e.error||e)+'</pre></div></div>';
  }
});

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const arr=x=>Array.isArray(x)?x:[];
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3600)}
const fmtDate=t=>t?new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';

/* ================= storage ================= */
const KEY='careermitra_v1',SKEY='careermitra_session_v1',EKEY='careermitra_last_email';
let mem=null;
function loadDB(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return mem||{users:[],students:{},families:{}}}
let DB=loadDB();
function save(){if(typeof S!=='undefined'&&S.demo)return;mem=DB;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Storage full.')}}
function getSess(){try{return sessionStorage.getItem(SKEY)||localStorage.getItem(SKEY)}catch(e){return null}}
function setSess(id,remember){try{sessionStorage.removeItem(SKEY);localStorage.removeItem(SKEY);if(id){(remember===false?sessionStorage:localStorage).setItem(SKEY,id)}}catch(e){}}
function lastEmail(){try{return localStorage.getItem(EKEY)||''}catch(e){return''}}
function setLastEmail(e){try{localStorage.setItem(EKEY,e)}catch(x){}}
const touch=r=>{if(r)r.updated=Date.now()};

/* ================= auth ================= */
async function hashPw(pw,salt){
  if(!(window.crypto&&crypto.subtle))throw 'Crypto unavailable.';
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function register(role,email,pw,pw2){
  email=email.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))throw 'Enter a valid email address.';
  if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw))throw 'Password needs 8+ characters with letters & numbers.';
  if(pw!==pw2)throw 'Passwords do not match.';
  if(DB.users.some(u=>u.email===email))throw 'Email already registered. Log in instead.';
  const salt=uid()+uid(),hash=await hashPw(pw,salt);
  const u={id:uid(),email,role,salt,hash,created:Date.now(),lastLogin:Date.now()};
  DB.users.push(u);
  if(role==='student')DB.students[u.id]={stage:null,profile:null,vault:null,test:null,progress:{},linkCode:'CM-'+Math.random().toString(36).slice(2,8).toUpperCase(),updated:Date.now()};
  else DB.families[u.id]={profile:null,rating:null,status:null,qa:[],questions:null,progress:{},updated:Date.now()};
  save();return u;
}
async function login(role,email,pw){
  email=email.trim().toLowerCase();
  const u=DB.users.find(x=>x.email===email);
  if(!u)throw 'No account found on this device.';
  if((await hashPw(pw,u.salt))!==u.hash)throw 'Incorrect password.';
  if(role&&u.role!==role)throw `Registered as a ${u.role}, not ${role}.`;
  u.prevLogin=u.lastLogin;u.lastLogin=Date.now();save();
  return u;
}

/* ================= API Communication ================= */
let AI_READY=true;
const CM_AI_CACHE_KEY='cm_ai_cache_v2';
const CM_AI_CACHE_TTL=7*24*60*60*1000;
const CM_AI_INFLIGHT=new Map();
let CM_AI_QUEUE=Promise.resolve();
let CM_AI_NEXT_AT=0;
let CM_AI_COOLDOWN_UNTIL=0;
function cmHash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function cmSleep(ms){return new Promise(r=>setTimeout(r,Math.max(0,ms)))}
function cmReadCache(key){try{const all=JSON.parse(localStorage.getItem(CM_AI_CACHE_KEY)||'{}');const x=all[key];if(x&&Date.now()-x.t<CM_AI_CACHE_TTL)return x.v;if(x)delete all[key];localStorage.setItem(CM_AI_CACHE_KEY,JSON.stringify(all));}catch(e){}return null}
function cmWriteCache(key,v){try{const all=JSON.parse(localStorage.getItem(CM_AI_CACHE_KEY)||'{}');all[key]={t:Date.now(),v};const keys=Object.keys(all).sort((a,b)=>all[b].t-all[a].t).slice(0,24);const keep={};keys.forEach(k=>keep[k]=all[k]);localStorage.setItem(CM_AI_CACHE_KEY,JSON.stringify(keep));}catch(e){}}

async function aiJson(prompt,opts={}){
  if(!prompt||typeof prompt!=='string')return null;
  const webSearch=opts.webSearch===true||/live career research/i.test(prompt);
  const isTest=opts.purpose==='student test generation'||opts.testZone===true;
  const cacheKey=cmHash((webSearch?'web:':isTest?'test:':'ai:')+prompt);
  const bypassCache=opts.bypassCache===true||isTest;
  if(!bypassCache){const cached=cmReadCache(cacheKey);if(cached){AI_READY=true;window.CM_AI_ERROR='';return cached}}
  if(CM_AI_INFLIGHT.has(cacheKey))return CM_AI_INFLIGHT.get(cacheKey);

  const job=(CM_AI_QUEUE=CM_AI_QUEUE.then(async()=>{
    try{
      const wait=Math.max(0,CM_AI_NEXT_AT-Date.now(),CM_AI_COOLDOWN_UNTIL-Date.now());
      if(wait)await cmSleep(wait);
      CM_AI_NEXT_AT=Date.now()+400;
      const r=await fetch('/api/ai',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          prompt,
          webSearch,
          career:opts.career||'',
          purpose:opts.purpose||(isTest?'student test generation':''),
          testZone:isTest,
          vault:opts.vault||null,
          stage:opts.stage||''
        })
      });
      const data=await r.json().catch(()=>null);
      if(!r.ok){
        const retrySec=Number(data&&data.retryAfter)||0;
        if(r.status===429)CM_AI_COOLDOWN_UNTIL=Date.now()+Math.max(5000,Math.min(30000,retrySec*1000||8000));
        window.CM_AI_ERROR=(data&&data.error)||('API error '+r.status);
        return null;
      }
      const out=(data&&data.ok&&data.data&&typeof data.data==='object')?data.data:(data&&typeof data==='object'&&!data.error?data:null);
      if(out){
        if(data&&data.serverValidated) out._serverValidated=true;
        const usedFallback=Boolean(data&&data.fallbackUsed);
        AI_READY=!usedFallback;
        if(usedFallback) out._aiFallback=true;
        if(!bypassCache&&!usedFallback)cmWriteCache(cacheKey,out);
        return out;
      }
      window.CM_AI_ERROR=(data&&data.error)||'No data returned.';
      return null;
    }catch(e){
      window.CM_AI_ERROR=e&&e.message?e.message:String(e);
      return null;
    }
  }).catch(e=>{window.CM_AI_ERROR=e&&e.message?e.message:String(e);return null;}));
  CM_AI_INFLIGHT.set(cacheKey,job);
  try{return await job}finally{CM_AI_INFLIGHT.delete(cacheKey)}
}

const LET=['R','I','A','S','E','C'];
const TR={
 R:{n:'Realistic',who:'Builder',t:['Hands-on','Practical','Mechanically minded','Persistent'],cat:'Technical & hands-on careers'},

function vf(f,val,stage){
 val=String(val==null?'':val).trim();
 if(!val)return f.req===false?'':'This field is required.';
 const n=+val;
 switch(f.v){
   case 'name':if(!/^[\p{L}][\p{L} .'\-]{1,59}$/u.test(val))return'Letters only (2–60 chars).';break;
   case 'phone':if(!/^(\+91)?[6-9]\d{9}$/.test(val.replace(/[\s\-]/g,'')))return'Enter valid 10-digit mobile number.';break;
   case 'pin':if(!/^[1-9]\d{5}$/.test(val))return'PIN code must be 6 digits.';break;
   case 'pct':case 'score':if(isNaN(n)||n<0||n>100)return'Between 0 and 100.';break;
   case 'year':if(!(n>=1995&&n<=YR+6))return`Between 1995 and ${YR+6}.`;break;
   case 'link':if(!studentByCode(val.toUpperCase()))return'No student found with this code.';break;
   case 'dob':{const d=new Date(val);if(isNaN(d)||d>new Date())return'Invalid date of birth.';break}
 }
 return'';
}

 const required=f.req!==false?' required':'', a=[];
 if(f.t==='date') a.push(`max="${TODAY}"`);
 if(f.v==='phone') a.push('maxlength="10"','inputmode="numeric"');

 const rq=f.req===false?' <span class="muted">(optional)</span>':' *',cls='f'+(f.wide||f.t==='textarea'?' wide':'');

 if(f.t==='textarea')inp=`<textarea name="${f.n}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}" ${attrs}>${esc(val)}</textarea>`;
 else if(f.t==='select')inp=`<select name="${f.n}" ${attrs}><option value="">Select…</option>${f.opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
 else inp=`<input name="${f.n}" type="${f.t||'text'}" value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${attrs}>`;
 return`<label class="${cls}"><span>${f.l}${rq}</span>${inp}<small class="ferr" id="fe-${f.n}"></small></label>`;

/* ================= AI CAREER RECORD NORMALIZATION ================= */
function aiCareerRecord(cand, i, st) {
  const name = String(cand && (cand.name || cand.career) || '').trim();
  const fit = String(cand && cand.fit || 'Possible fit');
  const prof = (cand && cand.profile) || {};
  
  // Extract pros & cons
  let pros = arr(prof.pros).length ? prof.pros : arr(cand?.pros);
  if (!pros.length) pros = arr(cand?.evidence).length ? cand.evidence : ['High operational & domain relevance', 'Clear career progression ladder'];
  
  let cons = arr(prof.cons).length ? prof.cons : arr(cand?.cons);
  if (!cons.length) cons = arr(cand?.watchouts || cand?.tradeoffs).length ? (cand.watchouts || cand.tradeoffs) : ['Demanding selection & competitive entrance examinations', 'High physical & operational vigilance required'];
  
  // Extract market & pathway
  const mkt = prof.market || prof.pay || cand?.mkt || cand?.pay || 'Competitive structured salary with regular allowances & progression.';
  const demand = prof.demand || cand?.demand || 'Steady demand via periodic national/state selection notifications.';
  const future = prof.future || cand?.future || 'Long-term outlook supported by national infrastructure & sector modernization.';
  
  const academic = prof.education || cand?.academic || 'Relevant 10+2 / Diploma / Bachelor degree as specified by official notification.';
  const vocational = prof.vocational || cand?.vocational || 'Recognized ITI / Polytechnic Diploma / Apprentice training in relevant branch.';
  
  const cert = arr(prof.courses || prof.certifications || cand?.certifications).length ? (prof.courses || prof.certifications || cand.certifications) : ['Medical Fitness Standard Certification', 'Trade Competency License'];
  const skills = arr(prof.skills || cand?.skills).length ? (prof.skills || cand.skills) : ['Technical troubleshooting', 'Procedural accuracy', 'Vigilance & situational awareness'];
  const alts = arr(prof.alternatives || cand?.alternatives).length ? (prof.alternatives || cand.alternatives) : ['Allied Technical Operations', 'Fleet & Infrastructure Maintenance'];

  return {
    n: name || 'Career Direction',
    fit: fit,
    score: typeof cand?.score==='number'?cand.score:(fit.toLowerCase().includes('strong')?0.88:fit.toLowerCase().includes('moderate')?0.74:0.62),
    rank: i,
    strong: arr(cand?.evidence).length ? cand.evidence : [`Demonstrated aptitude in ${TR[cand?.c?.[0]||'R']?.n||'technical'} competencies.`],
    watch: arr(cand?.watchouts).length ? cand.watchouts : [],
    pros: pros,
    cons: cons,
    mkt: mkt,
    demand: demand,
    future_growth: future,
    academic: academic,
    vocational: vocational,
    cert: cert,
    skills: skills,
    alt: alts,
    aiReason: String(cand?.reason || prof.summary || 'Selected through analytical intersection of test responses and student vault.')
  };
}

  const share={};LET.forEach(k=>share[k]=(tally[k]||0)/total);
  const order=[...LET].sort((a,b)=>share[b]-share[a]);
  const [a,b]=order;
  const v=st.vault||{};
  const ai=st.test&&st.test.ai||{};

        vocational: 'Act Apprenticeship or Polytechnic Diploma in relevant engineering streams.',
        cert: ['A-1 Medical Fitness (strict vision criteria)', 'RRB Computer-Based Aptitude Test (CBAT)'],
        skills: ['Operational alertness', 'Mechanical troubleshooting', 'Emergency protocol adherence'],
        alt: [firstRole, alt],
        aiReason: 'Direct alignment with student vault non-negotiable choice.'
      },
      {
        n: firstRole,
        fit: 'Good fit',
        score: 0.76,
        rank: 1,
        strong: ['Matches student interest in practical machinery and systems.'],

        pros: ['Steady engineering industry growth.', 'Wide applicability across public and private infrastructure.'],
        cons: ['Continuous upskilling needed for new automation standards.'],
        mkt: 'Starting ₹3.5–6 LPA; senior engineers ₹12–18+ LPA.',
        demand: 'Consistent hiring across logistics, transport, and manufacturing sectors.',

      }
    ];
  }

  const aiTraits=arr(ai.traits).map(String).filter(Boolean);
  const aiCore=arr(ai.coreInterests).map(String).filter(Boolean);
  const aiDirections=arr(ai.careerDirections).map(String).filter(Boolean);

  return {
    share,
    order,
    roles,
    type: ai.personalityType || `${TR[a].who}–${TR[b].who} (${a}${b})`,
    traits: aiTraits.length?aiTraits:[...TR[a].t,...TR[b].t.slice(0,2)],
    overall: ai.summary || `Your responses reflect a practical, task-focused pattern with strong operational strengths.`,
    inclined: aiDirections.length?aiDirections:[TR[a].cat,TR[b].cat],
    interests: aiCore.length?aiCore:[...new Set([v.field,v.nonnegotiable,...arr(v.interests)])].filter(Boolean).slice(0,6),
    source: aiList.length?'ai':'recovery'
  };

 else if(a==='roleadd'){const inp=$('#in-role'),sec=$('#sec-role');if(inp&&inp.value.trim()){S.vd.roles.push({name:inp.value.trim(),sector:sec.value});render()}}
 else if(a==='rolerm'){S.vd.roles.splice(+D.i,1);render()}
 else if(a==='savesec'){
   const k=D.k,v=stu().vault||(stu().vault={saved:{}});
   if(k==='nonnegotiable')v.nonnegotiable=S.vd.nonnegotiable.trim();
   else if(k==='field'){v.field=S.vd.field.trim();v.whyField=S.vd.whyField.trim();v.whyNotOthers=S.vd.whyNotOthers.trim();v.alternatives=[...S.vd.alternatives]}
   else if(k==='subjects')v.subjects=S.vd.subjects.map(x=>({...x}));
   else if(k==='roles')v.roles=S.vd.roles.map(x=>({...x}));
   else v[k]=[...S.vd[k]];
   v.saved[k]=true;touch(stu());save();toast('Section saved ✓');render();
 }
 else if(a==='starttest'){
   S.tstate='loading';render();
   const res=await makeQuestions(stu());
   S.tq={q:res.q,a:Array(TQ_N).fill(null),i:0};
   S.tstate='running';render();
 }
 else if(a==='pick'){S.tq.a[S.tq.i]=+D.j;render()}
 else if(a==='qprev'){S.tq.i--;render()}
 else if(a==='qnext'){S.tq.i++;render()}
 else if(a==='finish'){
   const s=stu(),{q,a}=S.tq,tally={R:0,I:0,A:0,S:0,E:0,C:0};
   q.forEach((qq,idx)=>{const o=qq.o[a[idx]];if(o&&o.trait)tally[o.trait]++});
   S.tstate='analysing';render();
   
   // Request real student test analysis
   const prompt=`Analyze student test: VAULT: ${JSON.stringify(s.vault)}, TALLY: ${JSON.stringify(tally)}`;
   const aiResult=await aiJson(prompt,{purpose:'student test answer analysis',bypassCache:true});
   
   s.test={tally,takenAt:Date.now(),ai:aiResult};
   s.progress.score=true;
   touch(s);save();S.tstate='idle';S.tab='score';toast('Analysis ready!');render();
 }
 else if(a==='markdone'){const s=stu();s.progress[D.p]=true;touch(s);save();toast('Progress saved ✓');render()}
 else if(a==='satisfied'){const f=fam();f.status='supportive';f.rating=S.rating;touch(f);save();toast('Support recorded ✓');S.tab='issues';render()}
 else if(a==='unsatisfied'){const f=fam();f.status='unsatisfied';f.rating=S.rating;touch(f);save();S.tab='issues';render()}
 else if(a==='quickissues'){const f=fam();f.qa=Array(15).fill({q:'Concern recorded',a:'Family expectations aligned',accepted:true});touch(f);save();toast('Concerns saved ✓');render()}
});

document.addEventListener('submit',async e=>{
 const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();
 const k=form.dataset.form,d=Object.fromEntries(new FormData(form));
 try{
   if(k==='register'||k==='login'){
     const u=k==='register'?await register(S.authRole,d.email,d.password,d.password2):await login(S.authRole,d.email,d.password);
     setSess(u.id);S.uid=u.id;S.tab='profile';go(u.role);
   }else if(k==='sprofile'){
     const s=stu();s.profile=d;s.stage=d.stage||s.stage||'ug';touch(s);save();S.tab='vault';toast('Profile saved ✓');render();
   }else if(k==='fprofile'){
     const f=fam();f.profile=d;touch(f);save();S.tab='sat';toast('Family profile saved ✓');render();
   }
 }catch(err){const el=$('#err');if(el)el.textContent=typeof err==='string'?err:err.message}
});

render();
</script>
</body>
</html>
